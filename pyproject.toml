[project]
name = "tp-simu-auto"
version = "0.1.0"
description = "Simulation d'un automate pilotant un verin Festo, expose en Modbus TCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymodbus>=3.15.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
